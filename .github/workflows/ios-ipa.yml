# Builds an unsigned iOS .ipa when a version tag (0.0.1 or v0.0.1) is pushed, and uploads it as a
# workflow artifact. Unsigned: re-sign it with your own Apple ID to install (AltStore, Sideloadly, ...).
#
# One-time setup: repo Settings > Secrets and variables > Actions, add UNITY_LICENSE (the contents of
# a Unity .ulf), UNITY_EMAIL and UNITY_PASSWORD. See https://game.ci/docs/github/activation
name: iOS IPA

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  unity-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^bundleVersion: .*/bundleVersion: $VERSION/" ProjectSettings/ProjectSettings.asset

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-iOS-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.8f1
          targetPlatform: iOS
          buildMethod: ProjectBootstrap.StereoBuilder.BuildIos
          allowDirtyBuild: true

      # The Xcode project is written to Builds/iOS (see StereoBuilder.XcodeProject).
      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: Builds/iOS
          if-no-files-found: error

  ipa:
    needs: unity-export
    runs-on: macos-15
    permissions:
      contents: write  # needed to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: Builds/iOS

      - name: Build unsigned archive
        run: |
          xcodebuild -project Builds/iOS/Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos -archivePath build/CardboardXR.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -30

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/CardboardXR.xcarchive/Products/Applications/*.app Payload/
          zip -qry CardboardXR-${GITHUB_REF_NAME}.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CardboardXR-ipa
          path: '*.ipa'
          if-no-files-found: error

      # On a version tag, attach the raw .ipa to the GitHub Release (created if missing).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.ipa'
          generate_release_notes: true
