<style>
/* Layout: a 16:9 recording frame that fills the window. Header across the top, chart on the left, headset card on the right. Type scales with the frame (cqw). */
:root{
  --bg:#f3f1ee; --surface:#ffffff; --ink:#1b1d24; --muted:#636775; --line:#d9d6d1; --grid:#e8e5e0;
  --phone:#a8692c; --pc:#2f6fd0; --standalone:#7b4fc9; --glasses:#0f8a7a; --console:#c23b5a; --ar:#5f8a1f; --gap:#a8692c22;
  --focus:#1b1d24;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141a; --surface:#1b1e26; --ink:#eceae6; --muted:#9a9eab; --line:#2e323d; --grid:#232731;
  --phone:#e0a060; --pc:#6ea3f5; --standalone:#ad8cf0; --glasses:#3fc4b0; --console:#f07a93; --ar:#a6d063; --gap:#e0a06024; --focus:#eceae6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141a; --surface:#1b1e26; --ink:#eceae6; --muted:#9a9eab; --line:#2e323d; --grid:#232731;
  --phone:#e0a060; --pc:#6ea3f5; --standalone:#ad8cf0; --glasses:#3fc4b0; --console:#f07a93; --ar:#a6d063; --gap:#e0a06024; --focus:#eceae6; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.4;display:grid;place-items:center;overflow:hidden}
.frame{container-type:size;width:min(100vw,calc(100dvh*16/9));height:min(100dvh,calc(100vw*9/16));
  padding-block:2.2cqh;padding-left:max(2cqw,env(safe-area-inset-left,0px));padding-right:max(2cqw,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:minmax(0,1fr) 27cqw;grid-template-rows:auto auto minmax(0,1fr);gap:1.6cqh 1.6cqw}
header{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:2cqw}
h1{font-family:var(--f-display);font-weight:800;font-size:3.3cqw;line-height:.9;margin:0;letter-spacing:.01em}
.periods{display:flex;gap:.5cqw;flex-shrink:0}
.periods button{font:600 1.05cqw var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:.6cqw;padding:.55cqw 1cqw;cursor:pointer;display:grid;gap:.15cqw;text-align:left;min-width:7.6cqw}
.periods button span{font:500 .8cqw var(--f-mono);color:var(--muted);letter-spacing:.04em}
.periods button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.periods button[aria-pressed="true"] span{color:var(--bg);opacity:.75}
.controls{grid-column:1;display:flex;flex-wrap:wrap;gap:.6cqw 1.2cqw;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:.2cqw;background:var(--surface)}
.seg button{font:500 .85cqw var(--f-body);color:var(--muted);background:none;border:0;border-radius:999px;padding:.35cqw .9cqw;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:.4cqw}
.chip{display:inline-flex;align-items:center;gap:.45cqw;font:500 .85cqw var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.3cqw .8cqw;cursor:pointer}
.chip[aria-pressed="false"]{opacity:.4}
.chip i{width:.65cqw;height:.65cqw;border-radius:50%;display:block}
.chip.reset{margin-left:auto}
.period-title{grid-column:2;grid-row:2;align-self:center;font:500 .85cqw var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.handle:focus-visible rect{stroke-width:2.5}
.handle,.handle-pan{touch-action:none}
button:focus-visible,.dot:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.stage{grid-column:1;grid-row:3;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:1cqw;overflow:hidden;position:relative}
svg{display:block;width:100%;height:100%}
svg text{font-family:var(--f-body);fill:var(--ink)}
.axis text{font-family:var(--f-mono);font-size:12px;fill:var(--muted)}
.lane-label{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.dot{cursor:pointer}
.dot .lbl{font-size:14px;font-weight:500}
.dot .yr{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.dot.dim{opacity:.18}
.dot.sel .mark{stroke:var(--ink);stroke-width:3}
.fadein .dot text,.fadein .dot line{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
svg.morph :not(.dot)>:is(line,text,rect,path,circle){animation:fade .6s ease-out both}
.ctx text{font-family:var(--f-body);fill:var(--ink);opacity:.85}
.ctx{cursor:pointer}
.ctx:hover text,.ctx.on text{opacity:1}
.ctx:focus-visible{outline:2px solid var(--focus)}
.tech-hero{aspect-ratio:4/3;width:100%;border-radius:.6cqw;background:color-mix(in srgb,var(--phone) 16%,var(--surface));display:grid;align-content:space-between;padding:1.4cqw}
.tech-hero .k{font:600 1.2cqw var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--phone)}
.tech-hero .y{font:800 7cqw/0.85 var(--f-display);color:var(--phone)}
.label{font:500 .68cqw var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.3cqh}
@media (max-width:760px),(max-aspect-ratio:1/1){.tech-hero{padding:16px}.tech-hero .k{font-size:16px}.tech-hero .y{font-size:72px}.label{font-size:11px}}
.detail{grid-column:2;grid-row:3;min-height:0;display:flex;flex-direction:column;gap:1.1cqh;background:var(--surface);border:1px solid var(--line);border-radius:1cqw;padding:1.2cqw;border-top:.45cqw solid var(--c,var(--ink));overflow:hidden}
.photo{margin:0;display:grid;gap:.5cqh}
.photo .frame-img{aspect-ratio:4/3;width:100%;border-radius:.6cqw;overflow:hidden;background:var(--bg);display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .none{font-size:.85cqw;color:var(--muted);padding:1cqw;text-align:center}
.photo figcaption{font-size:.62cqw;line-height:1.35;color:var(--muted)}
.photo figcaption a{color:inherit}
.eyebrow{font:500 .8cqw var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.detail h2{font-family:var(--f-display);font-weight:800;font-size:2.3cqw;line-height:.95;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:.4cqw}
.tag{font:500 .72cqw var(--f-mono);border:1px solid var(--line);border-radius:.35cqw;padding:.15cqw .5cqw;color:var(--muted)}
.tag.status{color:var(--ink)}
.specs{display:grid;gap:.8cqh;margin:0}
.specs div{display:grid;grid-template-columns:7cqw minmax(0,1fr);gap:.6cqw;align-items:baseline}
.specs dt{font:500 .68cqw var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.specs dd{margin:0;font-weight:500;font-size:.95cqw}
.price-big{font:600 1.9cqw var(--f-display);letter-spacing:.01em}
.why{margin:0;font-size:.95cqw;color:var(--ink)}
.src{font-size:.62cqw;color:var(--muted)}
.src a{color:inherit}
.nav{margin-top:auto;display:flex;align-items:center;gap:.6cqw}
.nav button{font:500 .85cqw var(--f-body);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:.5cqw;padding:.45cqw .9cqw;cursor:pointer;white-space:nowrap}
.count{font:.75cqw var(--f-mono);color:var(--muted);flex:1;text-align:center}
@media (max-width:760px), (max-aspect-ratio:1/1){
  body{display:block;overflow:auto}
  .frame{container-type:inline-size;width:100%;height:auto;grid-template-columns:1fr;grid-template-rows:none;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px}
  header{flex-direction:column;align-items:flex-start}
  h1{font-size:9cqw}
  .periods{flex-wrap:wrap}.periods button{font-size:14px;min-width:0;padding:8px 12px}.periods button span{font-size:11px}
  .seg button,.chip{font-size:13px;padding:6px 12px}.chip i{width:9px;height:9px}
  .period-title{grid-column:1;grid-row:auto;font-size:12px}
  .stage{grid-row:auto;overflow-x:auto}
  svg{min-width:760px;height:auto}
  .detail{grid-column:1;grid-row:auto;padding:16px;gap:10px}
  .detail h2{font-size:30px}.eyebrow,.tag,.count{font-size:12px}.specs div{grid-template-columns:110px 1fr}.specs dt{font-size:11px}.specs dd,.why{font-size:15px}
  .price-big{font-size:28px}.photo figcaption,.src{font-size:11px}.nav button{font-size:13px;padding:8px 14px}
}
@media (prefers-reduced-motion:no-preference){.dot circle.mark{transition:r .15s}.dot:hover circle.mark{r:9}}
</style>

<main class="frame">
  <header>
    <h1>From Cardboard to VR Glasses</h1>
    <div class="periods" role="group" aria-label="Periods">
      <button data-p="ground" aria-pressed="false">Groundwork<span>2007–2013</span></button>
      <button data-p="rise" aria-pressed="false">The rise<span>2013–2017</span></button>

  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="View">
      <button id="v-price" aria-pressed="true">By launch price</button>

    </div>
    <div class="legend" id="legend" role="group" aria-label="Filter by form factor"></div>

  <div class="stage"><svg id="chart" role="img" aria-label="Timeline of VR headsets"></svg></div>

  <section class="detail" id="detail" aria-live="polite"></section>
</main>

  const lab=el("text",{x:xx,y:top-10,"text-anchor":"middle","font-size":11,fill:css("--muted"),"font-family":"var(--f-mono)"},g); lab.textContent="price";
  return g;
}
let geo={};
let PARENT=null;
function dotNode(item,cx,cy,lab){
  const lane=laneOf(item.lane), c=css(lane.color);
  const g=el("g",{class:"dot"+(item.i===sel?" sel":"")+(active.has(item.lane)?"":" dim"),tabindex:active.has(item.lane)?0:-1,role:"button","data-n":item.n,"aria-label":`${item.n}, ${item.shown}, ${item.priceTxt}`},PARENT||svg);
  const pr=item.priceTxt.split(" ")[0].replace(";","");
  el("title",{},g).textContent=`${item.n} · ${item.shown} · ${item.priceTxt}`;
  if(lab.lead&&!lab.inline&&!animating) el("line",{x1:cx,x2:lab.lx??cx,y1:cy+(lab.side<0?-8:8),y2:lab.side<0?lab.y+4:lab.y-14,stroke:c,"stroke-width":1,opacity:.6},g);
  if(item.dev) el("rect",{class:"mark",x:cx-6.5,y:cy-6.5,width:13,height:13,rx:2,fill:c},g);
  else el("circle",{class:"mark",cx,cy,r:7,fill:item.future?css("--surface"):c,stroke:c,"stroke-width":item.future?2.5:0},g);
  if(!lab.none&&!animating){
  if(lab.inline&&lab.lead){const ex=lab.anchor==="end"?lab.x+2:lab.anchor==="start"?lab.x-2:lab.x;el("line",{x1:cx,y1:cy,x2:ex,y2:lab.y-4,stroke:c,"stroke-width":1,opacity:.6},g);}
  if(lab.inline){
    const t=el("text",{class:"lbl",x:lab.x,y:lab.y,"text-anchor":lab.anchor},g);t.textContent=item.s+"  ";
    const ts=el("tspan",{class:"yr"},t);ts.textContent=pr;
  } else {
    const ny=lab.side<0?lab.y-12:lab.y, py=lab.side<0?lab.y:lab.y+12;
    const tx0=lab.lx??cx;
    const t=el("text",{class:"lbl",x:tx0,y:ny,"text-anchor":"middle"},g);t.textContent=item.s;
    const y2=el("text",{class:"yr",x:tx0,y:py,"text-anchor":"middle"},g);y2.textContent=pr;
  }}
  g.addEventListener("click",()=>{sel=item.i;selTech=null;draw();show()});
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();sel=item.i;selTech=null;draw();show()}});
  return g;
}

function drawLanes(){
  R=24;
  const techH=106*techW, top=26;
  const avg=id=>{const v=D.filter(d=>d.lane===id).map(d=>d.price);return v.reduce((a,b)=>a+b,0)/v.length;};
  const ORDER=[...LANES].sort((a,b)=>avg(b.id)-avg(a.id));
  const VIS=ORDER.filter(l=>laneW[l.id]>0.001);
  const sumW=VIS.reduce((a,l)=>a+laneW[l.id],0)||1;
  let H;
  if(MOBILE.matches){ W=1120; H=top+6*118+techH+64; }
  else { const {cw,ch}=stageSize(); const need=top+techH+70+Math.max(sumW,1)*148; W=Math.max(640,Math.min(1500,need*cw/ch)); H=W*ch/cw; }
  const space=H-top-techH-70; let yc=top;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.innerHTML="";
  axis(H,top-8,64);
  brushX(H-18); geo={top,bot:H-64};
  VIS.forEach((l,li)=>{
    const wgt=laneW[l.id], h=space*wgt/sumW, cy=yc+h/2+6; yc+=h;
    const P=el("g",{opacity:Math.min(1,wgt)},svg); PARENT=P;
    el("line",{x1:L-6,x2:W-R,y1:cy,y2:cy,stroke:css(l.color),"stroke-width":2,opacity:.35},P);
    const lt=el("text",{class:"lane-label",x:16,y:cy+5,fill:css(l.color)},P);lt.textContent=l.name;
    if(l.id==="phone"){
      const a=Math.max(L,x(new Date("2019-10-15").getTime())), b=Math.min(W-R,x(new Date("2026-08-01").getTime()));
      if(b-a>40){
      el("rect",{x:a,y:cy-20,width:b-a,height:40,rx:6,fill:css("--gap")},P);
      const g=el("text",{x:(a+b)/2,y:cy+4,"text-anchor":"middle","font-size":12,fill:css("--muted"),"font-style":"italic"},P);g.textContent="Phone VR goes quiet";}
      const cx=x(new Date("2026-10-19").getTime());
      if(inX(new Date("2026-10-19").getTime())){
      el("circle",{cx,cy,r:7,fill:"none",stroke:css(l.color),"stroke-width":2,"stroke-dasharray":"3 2"},P);
      const t=el("text",{x:cx,y:cy-16,"text-anchor":"middle","font-size":12,"font-weight":600,fill:css(l.color)},P);t.textContent="CardboardXR";}
    }
    // greedy label tiers: alternate above/below, push to next tier on overlap
    const items=D.filter(d=>d.lane===l.id&&inX(d.t)).sort((a,b)=>a.t-b.t);
    const placed={"-1":[], "1":[]};
    items.forEach((it,k)=>{
      const cx=x(it.t), w=Math.max(textW(it.s,13),40)+10, lx=clamp(cx,L+w/2,W-R-w/2);
      let side=k%2===0?-1:1, tier=0;
      const last=li===VIS.length-1;
      const fits=(s,tr)=>!(last&&s>0&&tr>0) && !placed[s].some(p=>p.tier===tr && Math.abs(p.cx-lx)<(p.w+w)/2);
      let ok=false;
      for(tier=0;tier<2&&!ok;tier++){ for(const s of [side,-side]){ if(fits(s,tier)){side=s;ok=true;break;} } if(ok)break; }
      if(!ok){ dotNode(it,cx,cy,{none:true}); return; }
      placed[side].push({cx:lx,w,tier});
      const ly=side<0? cy-14-tier*30 : cy+22+tier*30;
      dotNode(it,cx,cy,{side,y:ly,lx,lead:tier>0||Math.abs(lx-cx)>4});
    });
    PARENT=null;
  });
  // phone tech milestones: their own band under the lanes
  if(techW<0.01) return;
  const TG=el("g",{opacity:Math.min(1,techW)},svg);
  const y0=top+space+6, my=y0+14;
  el("line",{x1:L-6,x2:W-R,y1:my,y2:my,stroke:css("--muted"),"stroke-width":1,"stroke-dasharray":"2 4",opacity:.6},TG);
  const tl=el("text",{class:"lane-label",x:16,y:my+5,fill:css("--muted")},TG);tl.textContent="Phone tech";
  const tl2=el("text",{x:16,y:my+22,"font-size":12,fill:css("--muted"),"font-family":"var(--f-mono)"},TG);tl2.textContent="milestones";
  const rows=[[],[],[],[],[]];
  CTX.forEach(c=>{
    const t=new Date(c.d).getTime(); if(!inX(t)) return;
    const cx=x(t), w=textW(c.t,12.5)+12, lx=clamp(cx,L+w/2,W-R-w/2);
    let r=rows.findIndex(row=>!row.some(o=>Math.abs(o-lx)<(w+o.w)/2)); 
    if(r<0) return;
    const pos=Object.assign(new Number(lx),{w}); rows[r].push(pos);
    const ci=CTX.indexOf(c), on=ci===selTech;
    const g=el("g",{class:"ctx"+(on?" on":""),tabindex:0,role:"button","aria-label":c.t},TG);
    const ly0=my+22+r*16;
    el("rect",{x:Math.min(cx-6,lx-w/2),y:my-10,width:Math.max(w,Math.abs(lx-cx)+w/2+6),height:ly0-my+16,fill:"transparent"},g);
    el("path",{d:on?`M${cx} ${my-8} l8 8 l-8 8 l-8 -8 z`:`M${cx} ${my-5} l5 5 l-5 5 l-5 -5 z`,fill:css("--phone"),stroke:on?css("--ink"):"none","stroke-width":2},g);
    const pick=()=>{selTech=ci;draw();show();};
    g.addEventListener("click",pick);
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();}});
    const ly=my+22+r*16;
    if(r>0||Math.abs(lx-cx)>4) el("line",{x1:cx,x2:lx,y1:my+6,y2:ly-11,stroke:css("--muted"),"stroke-width":1,opacity:.45},g);
    const tx=el("text",{x:lx,y:ly,"text-anchor":"middle","font-size":12,"font-weight":on?700:500},g);tx.textContent=c.t;
  });
}

function drawPrice(){
  R=78;
  const top=62,bottom=64;
  let H;
  if(MOBILE.matches){ W=1120; H=760; }
  else { const {cw,ch}=stageSize(); W=1000; H=W*ch/cw; }
  const bot=H-bottom;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.innerHTML="";
  axis(H,top,bottom);
  const y=p=>bot-(p-yr[0])/(yr[1]-yr[0])*(bot-top);
  const g=el("g",{class:"axis"},svg);
  const st=niceStep(yTarget[1]-yTarget[0],7);
  for(let p=Math.ceil(yr[0]/st)*st;p<=yr[1]+1e-6;p+=st){const yy=y(p); if(yy<top-2) continue;
    el("line",{x1:L,x2:W-R,y1:yy,y2:yy,stroke:css("--grid")},g);
    const t=el("text",{x:L-8,y:yy+4,"text-anchor":"end"},g);t.textContent=money(p);}
  brushX(H-18); brushY(W-R+44,top,bot); geo={top,bot};
  const lt=el("text",{x:16,y:24,class:"lane-label",fill:css("--muted")},svg);lt.textContent="Launch price";
  const lt2=el("text",{x:16,y:40,"font-size":11,fill:css("--muted"),"font-family":"var(--f-mono)"},svg);lt2.textContent="USD, every "+money(st);
  const vis=D.filter(d=>active.has(d.lane)&&inX(d.t)&&d.price>=yr[0]&&d.price<=yr[1]);
  const dots=[];
  vis.forEach(it=>{let cx=x(it.t),cy=y(it.price);
    while(dots.some(d=>Math.hypot(d.cx-cx,d.cy-cy)<12)) cx+=13;
    dots.push({cx,cy})});
  const boxes=[];
  const over=(a,b)=>a.x1<b.x2&&a.x2>b.x1&&a.y1<b.y2&&a.y2>b.y1;
  const order=vis.map((it,k)=>k);
  order.forEach(k=>{const it=vis[k];
    const {cx,cy}=dots[k]; const w=textW(it.s+"  "+it.priceTxt.split(" ")[0],12.5)+8;
    const cands=[
      {anchor:"start",x:cx+12,y:cy+4},{anchor:"end",x:cx-12,y:cy+4},
      {anchor:"middle",x:cx,y:cy-14},{anchor:"middle",x:cx,y:cy+24},
      {anchor:"end",x:cx-12,y:cy-16},{anchor:"end",x:cx-12,y:cy+24},
      {anchor:"start",x:cx+12,y:cy-16},{anchor:"start",x:cx+12,y:cy+24},
      ...[-32,40,-48,56,-64,72].flatMap(dy=>[{anchor:"end",x:cx-12,y:cy+dy},{anchor:"start",x:cx+12,y:cy+dy}])];
    const box=c=>{const x1=c.anchor==="start"?c.x:c.anchor==="end"?c.x-w:c.x-w/2;return {x1,x2:x1+w,y1:c.y-12,y2:c.y+4}};
    const bad=c=>{const b=box(c);return b.x2>W-R||b.x1<L||b.y1<top-6||b.y2>bot||boxes.some(o=>over(o,b))||dots.some((d,j)=>j!==k&&over(b,{x1:d.cx-8,x2:d.cx+8,y1:d.cy-8,y2:d.cy+8}))};
    let ci=cands.findIndex(c=>!bad(c));
    if(ci<0){ dotNode(it,cx,cy,{none:true}); return; }
    const c=cands[ci];
    boxes.push(box(c));
    dotNode(it,cx,cy,{inline:true,anchor:c.anchor,x:c.x,y:c.y,lead:ci>=2});
  });
}

function draw(){ (view==="lanes"?drawLanes:drawPrice)();
  svg.classList.toggle("fadein",fadeNext); fadeNext=false;
  const near=(a,b)=>Math.abs(a-b)<864e5;
  let cur=animating&&goingTo?goingTo:null; if(!cur) for(const [k,v] of Object.entries(PERIODS)) if(near(xr[0],v.r[0])&&near(xr[1],v.r[1])) cur=k;
  document.querySelectorAll(".periods button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.p===cur));
  const fmt=t=>new Date(t).toLocaleDateString("en-US",{month:"short",year:"numeric"});
  document.getElementById("ptitle").textContent= cur ? `${PERIODS[cur].name} · ${PERIODS[cur].r===PERIODS.now.r?"2024–now":new Date(PERIODS[cur].r[0]).getUTCFullYear()+"–"+(new Date(PERIODS[cur].r[1]-864e5).getUTCFullYear())}` : `Custom range · ${fmt(xr[0])} – ${fmt(xr[1])}`;
  const auto=computeFit().join()===yTarget.join();
  const z=(!cur)||(view==="price"&&!auto);
  document.getElementById("reset").hidden=!z;
  if(focusK){const h=svg.querySelector(`.handle[data-k="${focusK}"]`); if(h) h.focus({preventScroll:true});}
}
function svgPt(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function setX(a,b){if(b-a<MINT){ if(a===xr[0]) b=a+MINT; else a=b-MINT; } xr=[clamp(a,T0,T1-MINT),clamp(b,T0+MINT,T1)];}
function setY(a,b){if(tw){cancelAnimationFrame(tw.raf);tw=null;} if(b-a<MINP){ if(a===yr[0]) b=a+MINP; else a=b-MINP; } yr=[clamp(a,P0,P1-MINP),clamp(b,P0+MINP,P1)]; yTarget=yr.slice();}
let drag=null;
svg.addEventListener("pointerdown",e=>{
  const h=e.target.closest("[data-k]"); if(!h) return;
  e.preventDefault(); const k=h.dataset.k; focusK=k.endsWith("m")?null:k;
  const pt=svgPt(e); drag={k,pt,xr:[...xr],yr:[...yr]};
  if(k.endsWith("m")) h.style.cursor="grabbing";
});
window.addEventListener("pointermove",e=>{
  if(!drag) return; const pt=svgPt(e), b=document.querySelector(".brush");
  const a=L, bb=W-R, tPer=(T1-T0)/(bb-a);
  const dt=(pt.x-drag.pt.x)*tPer, dp=-(pt.y-drag.pt.y)*(P1-P0)/(geo.bot-geo.top);
  const [x0,x1]=drag.xr,[y0,y1]=drag.yr;
  if(drag.k==="x0") setX(Math.min(x0+dt,x1-MINT),x1);
  if(drag.k==="x1") setX(x0,Math.max(x1+dt,x0+MINT));
  if(drag.k==="xm"){const d=clamp(dt,T0-x0,T1-x1); xr=[x0+d,x1+d];}
  if(drag.k[0]==="x") fitY();
  if(drag.k==="y0") setY(Math.min(y0+dp,y1-MINP),y1);
  if(drag.k==="y1") setY(y0,Math.max(y1+dp,y0+MINP));
  if(drag.k==="ym"){const d=clamp(dp,P0-y0,P1-y1); yr=[y0+d,y1+d];}
  draw();
});
window.addEventListener("pointerup",()=>{drag=null});
svg.addEventListener("keydown",e=>{
  const h=e.target.closest(".handle"); if(!h) return;
  const k=h.dataset.k, dir={ArrowLeft:-1,ArrowDown:-1,ArrowRight:1,ArrowUp:1}[e.key]; if(!dir) return;
  e.preventDefault(); e.stopPropagation(); focusK=k;
  const dt=dir*YEAR/4, dp=dir*50;
  if(k==="x0") setX(Math.min(xr[0]+dt,xr[1]-MINT),xr[1]);
  if(k==="x1") setX(xr[0],Math.max(xr[1]+dt,xr[0]+MINT));
  if(k==="y0") setY(Math.min(yr[0]+dp,yr[1]-MINP),yr[1]);
  if(k==="y1") setY(yr[0],Math.max(yr[1]+dp,yr[0]+MINP));
  if(k[0]==="x") fitY();
  draw();
});
document.getElementById("reset").onclick=()=>{focusK=null;goingTo="all";tweenAll(PERIODS.all.r);};

function showTech(){
  const c=CTX[selTech], box=document.getElementById("detail"), dt=new Date(c.d);
  box.style.setProperty("--c","var(--phone)");
  const src=c.src?`<div class="src">Sources: ${c.src.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`).join(" · ")}</div>`:"";
  box.innerHTML=`<div class="tech-hero"><div class="k">${c.k}</div><div class="y">${dt.getUTCFullYear()}</div></div>
    <div><div class="eyebrow">${dt.toLocaleDateString("en-US",{month:"short",year:"numeric",timeZone:"UTC"})}</div><h2>${c.t}</h2></div>
    <div class="meta"><span class="tag" style="color:var(--phone);border-color:var(--phone)">Phone tech</span><span class="tag status">${c.k}</span></div>
    <div><div class="label">What changed</div><p class="why">${c.n}</p></div>
    <div><div class="label">Why it matters for phone VR</div><p class="why">${c.why}</p></div>${src}
    <div class="nav"><button id="prev" aria-label="Previous milestone">← Earlier</button><span class="count">${selTech+1} / ${CTX.length}</span><button id="next" aria-label="Next milestone">Later →</button></div>`;
  document.getElementById("prev").onclick=()=>step(-1);
  document.getElementById("next").onclick=()=>step(1);
}
function show(){
  if(selTech!==null) return showTech();
  const it=D[sel], lane=laneOf(it.lane), box=document.getElementById("detail");
  box.style.setProperty("--c",`var(${lane.color})`);
  const src=it.src?`<div class="src">Sources: ${it.src.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`).join(" · ")}</div>`:"";
  const ph=PH[it.n];
  const fig=ph?`<figure class="photo"><div class="frame-img"><img src="${ph.img}" alt="${it.n}" loading="lazy"></div><figcaption>Photo: ${ph.by} · <a href="${ph.page}" target="_blank" rel="noopener">${ph.lic}</a>, via Wikimedia Commons</figcaption></figure>`
    :`<figure class="photo"><div class="frame-img"><div class="none">No freely licensed photo of this headset on Wikimedia Commons yet.</div></div></figure>`;
  box.innerHTML=fig+`
    <div><div class="eyebrow">${it.shown}</div><h2>${it.n}</h2></div>
    <div class="meta"><span class="tag" style="color:var(${lane.color});border-color:var(${lane.color})">${lane.name}</span><span class="tag status">${it.status}</span></div>
    <div class="price-big">${it.priceTxt}</div>
    <dl class="specs"><div><dt>Tracking</dt><dd>${it.track}</dd></div><div><dt>Input</dt><dd>${it.input}</dd></div></dl>
    <p class="why">${it.why}</p>${src}
    <div class="nav"><button id="prev" aria-label="Previous headset">← Earlier</button><span class="count">${sel+1} / ${D.length}</span><button id="next" aria-label="Next headset">Later →</button></div>`;
  document.getElementById("prev").onclick=()=>step(-1);
  document.getElementById("next").onclick=()=>step(1);
}
function step(dir){
  if(selTech!==null){ selTech=(selTech+dir+CTX.length)%CTX.length; draw(); show(); return; }
  let i=sel;
  for(let k=0;k<D.length;k++){i=(i+dir+D.length)%D.length;if(active.has(D[i].lane))break;}
  sel=i;draw();show();
}
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest(".handle"))return;if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});
function captureDots(){const m={};svg.querySelectorAll(".dot").forEach(g=>{const r=g.querySelector(".mark").getBoundingClientRect();m[g.dataset.n]={x:r.x+r.width/2,y:r.y+r.height/2};});return m;}
let morphRaf=null;
function setView(v,anim=true){
  const old=(anim&&!reduceMotion&&v!==view)?captureDots():null;
  view=v;legend();document.getElementById("v-lanes").setAttribute("aria-pressed",v==="lanes");document.getElementById("v-price").setAttribute("aria-pressed",v==="price");
  try{localStorage.setItem("vrtl-view2",v)}catch(e){}
  if(!old){ draw(); return; }
  if(morphRaf) cancelAnimationFrame(morphRaf);
  animating=true; draw();
  const sc=svg.getScreenCTM().a||1, items=[];
  svg.querySelectorAll(".dot").forEach(g=>{
    const r=g.querySelector(".mark").getBoundingClientRect(), o=old[g.dataset.n];
    if(o){ const it={g,dx:(o.x-(r.x+r.width/2))/sc,dy:(o.y-(r.y+r.height/2))/sc}; items.push(it); g.setAttribute("transform",`translate(${it.dx} ${it.dy})`); }
    else { g.style.opacity=0; items.push({g,fade:true}); }
  });
  svg.classList.add("morph");
  const start=performance.now(), dur=700, ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  const tick=now=>{const k=Math.min(1,(now-start)/dur), e=ease(k);
    items.forEach(it=>{ if(it.fade) it.g.style.opacity=e; else it.g.setAttribute("transform",`translate(${it.dx*(1-e)} ${it.dy*(1-e)})`); });
    if(k<1) morphRaf=requestAnimationFrame(tick);
    else { morphRaf=null; svg.classList.remove("morph"); animating=false; fadeNext=true; draw(); }};
  morphRaf=requestAnimationFrame(tick);
}
document.getElementById("v-lanes").onclick=()=>setView("lanes");
document.getElementById("v-price").onclick=()=>setView("price");
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
let rsz=null; window.addEventListener("resize",()=>{cancelAnimationFrame(rsz); rsz=requestAnimationFrame(()=>draw());});
MOBILE.addEventListener("change",draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
yr=computeFit();yTarget=yr.slice();legend();setView(view,false);show();
</script>
